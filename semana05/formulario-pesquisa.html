<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="estilos/exemplo2.css">
</head>

<body>

    <header>

        <main>
            <form>
                <label for="nomecompleto">Nome Completo:</label>
                <input type="text" name="nome-completo" id="nome-completo" required>
                <label for="emaildousuario">E-mail:</label>
                <input type="text" name="email-do-usuario" id="email-do-usuario" required>

                <label for="quantidade">Qual é o seu navegador favorito?</label>
                <select name="navegador" id="navegador">
                    <option value="1">Chrome</option>
                    <option value="2">Mozila</option>
                    <option value="3">Edge</option>
                </select>

                <label for="pet">Você tem um bichinho de estimação em casa?</label>
                <input type="checkbox" name="pet" id="pet">

                <label for="feedback">Liste os lugares onde você morou.</label>
                <textarea name="feedback" id="feedback" placeholder="Fortaleza, Recife, Santa Maria"
                    rows="4"></textarea>

                <button type="submit">Enviar Pesquisa</button>

            </form>

            <footer>

            </footer>
        </main>
    </header>

</body>

</html>
