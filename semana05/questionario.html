<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Questionario de HTML e CSS</title>
    <link rel="stylesheet" href="estilos/questionario.css">
</head>

<body>
    <header>
        <h1>Questionario de HTML e CSS</h1>
    </header>
    <main>
        <form action="">
            <label for="q1">1. O que significa a sigla CSS?</label>
            <input type="text" id="q1" name="q1">


            <label for="q2">2. Como os atributos "id" e "class" são selecionados no CSS?</label>
            <textarea name="q2" id="q2"></textarea>


            <label for="q3">3. Qual das opções abaixo é um comentário CSS válido?</label>
            <select name="q3" id="q3">
                <option value="" selected disabled>Escolha uma...</option>
                <option value="op01">Opção 01</option>
                <option value="op02">Opção 02</option>
                <option value="op03">Opção 03</option>
            </select>


            <label for="q4">Qual a margem inferior dada por esta declaração?</label>
            <input type="number" id="q4" name="q4">


            <button type="submit">ENVIAR QUESTIONÁRIO</button>
        </form>
    </main>
</body>

</html>
