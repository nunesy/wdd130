<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fale Conosco | Corredeiras</title>
    <meta name="description"
        content="Entre em contato com a equipe da Corredeiras! Tire suas dúvidas sobre nossos passeios de rafting, faça sua reserva em Foz do Iguaçu ou envie sua sugestão.">
    <meta name="author" content="Yuri Barboza Nunes">
    <link rel="stylesheet" href="estilos/rafting.css">
</head>

<body>

    <header>
        <div class="caixa-logo">
            <img src="imagens/logo.png" alt="Logo de rafting">
        </div>
        <nav>
            <ul class="menu">
                <li><a href="index.html">Página Inicial</a></li>
                <li><a href="sobre.html">Sobre Nós</a></li>
                <li><a href="passeios.html">Passeios</a></li>
                <li><a href="contato.html" class="menu-ativo">Fale Conosco</a></li>
            </ul>
        </nav>
    </header>

    <main>

        <div class="contato-container">

            <section class="contato-esquerda">
                <div class="empresa-info">
                    <h2>Companhia de Rafting em Corredeiras</h2>
                    <p class="endereco">123 Rua Principal do Rio<br>Foz do Iguaçu, Paraná</p>
                    <p><strong>Telefone:</strong> +55 45 99999-9999</p>
                    <p><strong>E-mail:</strong> info@corredeiras.com</p>
                </div>

                <div class="mapa-box">
                    <iframe class="mapa-google"
                        src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3600.632296464876!2d-54.5772!3d-25.5411!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x0%3A0x0!2zMjXCszMyJzI4LjAiUyA1NLCwMzQnMzcuOSJX!5e0!3m2!1spt-BR!2sbr!4v1680000000000!5m2!1spt-BR!2sbr"
                        width="100%" height="250" allowfullscreen="" loading="lazy"></iframe>
                </div>
            </section>

            <section class="contato-direita">
                <form action="#" method="POST" class="form-contato">
                    <div class="form-grupo">
                        <label for="nome">Nome</label>
                        <input type="text" id="nome" name="nome" required placeholder="Digite aqui">
                    </div>

                    <div class="form-grupo">
                        <label for="email">E-mail</label>
                        <input type="email" id="email" name="email" required placeholder="Digite aqui">
                    </div>

                    <div class="form-grupo">
                        <span class="label-fake">Propósito da Mensagem</span>
                        <div class="radio-opcoes">
                            <label><input type="radio" name="proposito" value="geral" checked> Dúvida Geral</label>
                            <label><input type="radio" name="proposito" value="reserva"> Pergunta sobre Reserva</label>
                            <label><input type="radio" name="proposito" value="sugestao"> Sugestão</label>
                        </div>
                    </div>

                    <div class="form-grupo">
                        <label for="mensagem">Mensagem</label>
                        <textarea id="mensagem" name="mensagem" rows="4" required placeholder="Digite aqui"></textarea>
                    </div>

                    <div class="checkbox-opcao">
                        <label>
                            <input type="checkbox" name="newsletter" value="sim"> Por favor, me inscreva na newsletter
                            mensal
                        </label>
                    </div>

                    <button type="submit" class="btn-enviar">Entrar em Contato</button>
                </form>
            </section>
        </div>

        <section class="sessao-equipe">
            <h2>Estamos Aqui para Servi-lo</h2>
            <div class="equipe-grid">
                <figure class="funcionario">
                    <img src="imagens/funcionario1.jpg" alt="Foto do Perfil do Funcionário">
                    <figcaption>Perfil do Funcionário</figcaption>
                </figure>

                <figure class="funcionario">
                    <img src="imagens/funcionario2.jpg" alt="Foto do Perfil do Funcionário">
                    <figcaption>Perfil do Funcionário</figcaption>
                </figure>

                <figure class="funcionario">
                    <img src="imagens/funcionario3.jpg" alt="Foto do Perfil do Funcionário">
                    <figcaption>Perfil do Funcionário</figcaption>
                </figure>
            </div>
        </section>

    </main>

    <footer>
        <p>&copy; 2026 Corredeiras | Yuri Barboza Nunes</p>
        <nav class="socialmedia">
            <a href=""><img src="imagens/facebook.svg" alt="facebook"></a>
            <a href=""><img src="imagens/instagram.svg" alt="instagram"></a>
            <a href=""><img src="imagens/linkedin.svg" alt="linkedin"></a>
        </nav>
    </footer>

</body>

</html>
